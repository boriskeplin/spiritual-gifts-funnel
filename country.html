<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Location — Gifted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FEF8E4;--card:#FFFDF0;--accent:#1B4B8A;--text:#160E05;--muted:#7A6240;--border:rgba(255,255,255,.1)}
body{background:var(--bg);color:var(--text);font-family:'Poppins',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 48px}
.logo{font-size:22px;font-weight:700;color:var(--accent);margin-bottom:32px;letter-spacing:-.5px}
.card{background:var(--card);border-radius:24px;padding:32px 24px;max-width:420px;width:100%;text-align:center}
.globe{width:160px;height:160px;margin:0 auto 24px;border-radius:50%;overflow:hidden;background:rgba(201,151,76,.08)}
.globe img{width:100%;height:100%;object-fit:cover}
.title{font-size:22px;font-weight:700;line-height:1.3;margin-bottom:10px}
.sub{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:28px}
.country-list{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.country-opt{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.04);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .2s,background .2s;text-align:left}
.country-opt:hover{border-color:var(--accent);background:rgba(201,151,76,.06)}
.country-opt.selected{border-color:var(--accent);background:rgba(201,151,76,.1)}
.flag{font-size:24px}
.country-name{font-size:15px;font-weight:600}
.country-sub{font-size:12px;color:var(--muted)}
.check{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.country-opt.selected .check{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
.check svg{width:12px;height:12px}
.cta-btn{display:block;width:100%;background:var(--accent);color:#FFFFFF;font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;border:none;border-radius:14px;padding:18px;cursor:pointer;transition:opacity .2s,transform .2s;margin-top:4px}
.cta-btn:hover{opacity:.9;transform:translateY(-1px)}
.secure{font-size:11px;color:var(--muted);margin-top:12px}
</style>
<script src="/config.js"></script>
<script>
/* GA4 */
(function(){
  if(!window.GIFTED_CONFIG||GIFTED_CONFIG.ga4Id.includes('PASTE'))return;
  var s=document.createElement('script');s.async=true;
  s.src='https://www.googletagmanager.com/gtag/js?id='+GIFTED_CONFIG.ga4Id;
  document.head.appendChild(s);
  window.dataLayer=window.dataLayer||[];
  function gtag(){dataLayer.push(arguments);}
  gtag('js',new Date());gtag('config',GIFTED_CONFIG.ga4Id);window._gtag=gtag;
})();
/* Facebook Pixel */
(function(){
  if(!window.GIFTED_CONFIG||GIFTED_CONFIG.fbPixelId.includes('PASTE'))return;
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
  (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init',GIFTED_CONFIG.fbPixelId);fbq('track','PageView');window._fbq=fbq;
})();
</script>
</head>
<body>
<div class="logo">✦ gifted</div>
<div class="card">
  <div class="globe">
    <img src="assets/country_main_image.b71561d4.webp" alt="Globe">
  </div>
  <div class="title">Where are you located?</div>
  <div class="sub">We'll customize your gift activation plan and pricing based on your location.</div>

  <div class="country-list">
    <div class="country-opt selected" onclick="select(this)">
      <span class="flag">🇬🇧</span>
      <div>
        <div class="country-name">United Kingdom</div>
        <div class="country-sub">English · GBP £</div>
      </div>
      <div class="check"><svg viewBox="0 0 12 12" fill="currentColor"><path d="M2 6l3 3 5-5"/><path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
    <div class="country-opt" onclick="select(this)">
      <span class="flag">🇺🇸</span>
      <div>
        <div class="country-name">United States</div>
        <div class="country-sub">English · USD $</div>
      </div>
      <div class="check"></div>
    </div>
    <div class="country-opt" onclick="select(this)">
      <span class="flag">🇨🇦</span>
      <div>
        <div class="country-name">Canada</div>
        <div class="country-sub">English · CAD $</div>
      </div>
      <div class="check"></div>
    </div>
    <div class="country-opt" onclick="select(this)">
      <span class="flag">🌍</span>
      <div>
        <div class="country-name">Other</div>
        <div class="country-sub">All countries supported</div>
      </div>
      <div class="check"></div>
    </div>
  </div>

  <button class="cta-btn" onclick="next()">Confirm & Continue →</button>
  <div class="secure">🔒 Your data is private and never shared</div>
</div>

<script>
function select(el){
  document.querySelectorAll('.country-opt').forEach(o=>{
    o.classList.remove('selected');
    o.querySelector('.check').innerHTML='';
  });
  el.classList.add('selected');
  el.querySelector('.check').innerHTML='<svg viewBox="0 0 12 12"><path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function next(){
  window.location.href='trial.html';
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Discover Your Spiritual Gift — Gifted Ministry</title>
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#EAF4F8;
      --bg2:#D6EAF2;
      --surface:#FFFFFF;
      --navy:#1B2A4A;
      --navy2:#253858;
      --gold:#C4913A;
      --gold-soft:#E8CFA0;
      --gold-pale:#F5EBD6;
      --text:#1B2A4A;
      --muted:#5A6E8A;
      --border:rgba(27,42,74,.11);
      --shadow:0 2px 24px rgba(27,42,74,.10);
      --shadow-sm:0 1px 8px rgba(27,42,74,.08);
      --red:#8B1A1A;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;-webkit-tap-highlight-color:transparent}
    body{
      background:var(--bg);min-height:100vh;
      font-family:'Inter',-apple-system,sans-serif;
      color:var(--text);-webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    #app{
      max-width:460px;margin:0 auto;min-height:100vh;
      display:flex;flex-direction:column;padding:0 18px 72px;
    }

    /* ── TRANSITIONS ── */
    .screen{animation:slideIn .28s cubic-bezier(.25,.46,.45,.94) both}
    .screen-out{animation:slideOut .18s ease-in both;pointer-events:none}
    @keyframes slideIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
    @keyframes slideOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-28px)}}

    /* ── LOGO / HEADER ── */
    .hdr{
      display:flex;justify-content:center;align-items:center;gap:10px;
      padding:22px 0 0;
    }
    .logo-text{
      font-family:'Cormorant Garamond',serif;
      font-size:17px;font-weight:600;letter-spacing:.6px;color:var(--navy);
    }

    /* ── PROGRESS ── */
    .prog-wrap{
      padding:14px 0 0;display:flex;flex-direction:column;gap:6px;
      align-items:center;
    }
    .prog-meta{font-size:11px;color:var(--muted);letter-spacing:.3px;font-weight:500;text-align:center}
    .prog-meta strong{color:var(--navy);font-weight:700}
    .prog-track{width:100%;height:3px;background:var(--border);border-radius:3px;overflow:hidden}
    .prog-fill{height:3px;background:linear-gradient(90deg,var(--gold),#E8A84C);border-radius:3px;transition:width .4s ease}

    /* ── BACK ── */
    .back{
      background:none;border:none;color:var(--muted);font-family:inherit;
      font-size:13px;cursor:pointer;padding:12px 0 0;
      display:flex;align-items:center;gap:5px;align-self:flex-start;font-weight:500;
    }
    .back:hover{color:var(--navy)}

    /* ── PHASE LABEL ── */
    .phase-lbl{
      display:inline-flex;align-items:center;gap:6px;
      background:var(--gold-pale);border:1px solid var(--gold-soft);
      border-radius:20px;padding:4px 12px;
      font-size:11px;font-weight:700;color:var(--gold);
      letter-spacing:.5px;text-transform:uppercase;align-self:center;margin-top:14px;
    }

    /* ── INTRO SCREEN ── */
    .intro{display:flex;flex-direction:column;align-items:center;padding:28px 0 32px;gap:0}
    .intro-img{
      width:100%;border-radius:16px;object-fit:cover;max-height:240px;
      box-shadow:var(--shadow);margin-bottom:22px;
    }
    .intro-eyebrow{
      font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
      color:var(--gold);margin-bottom:10px;text-align:center;
    }
    .intro-title{
      font-family:'Cormorant Garamond',serif;
      font-size:34px;font-weight:700;line-height:40px;
      text-align:center;color:var(--navy);margin-bottom:10px;
    }
    .intro-sub{font-size:14px;color:var(--muted);text-align:center;line-height:1.65;margin-bottom:8px;max-width:340px}
    .years-badge{
      display:flex;align-items:center;gap:8px;
      background:var(--navy);border-radius:12px;padding:10px 16px;
      font-size:12px;color:rgba(255,255,255,.75);margin:16px 0 24px;
      line-height:1.5;text-align:left;
    }
    .years-badge strong{color:var(--gold-soft);display:block;font-size:13px;margin-bottom:1px}
    .gender-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-bottom:16px}
    .g-btn{
      background:var(--surface);border:1.5px solid var(--border);
      border-radius:14px;color:var(--text);font-family:inherit;
      font-size:16px;font-weight:600;padding:20px 12px;cursor:pointer;text-align:center;
      transition:border-color .15s,background .15s,transform .1s;box-shadow:var(--shadow-sm);
    }
    .g-btn:hover{background:var(--bg2);border-color:var(--navy)}
    .g-btn.sel{background:rgba(27,42,74,.07);border-color:var(--navy);color:var(--navy)}
    .scripture-card{
      background:var(--surface);border-radius:12px;padding:14px 18px;width:100%;
      border-left:3px solid var(--gold);
    }
    .sc-text{font-family:'Cormorant Garamond',serif;font-size:15px;font-style:italic;line-height:24px;color:var(--text);margin-bottom:4px}
    .sc-ref{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.5px}

    /* ── QUESTION SCREEN ── */
    .q-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 18px;gap:0;width:100%}
    .q-img{width:100%;border-radius:14px;box-shadow:var(--shadow);margin:16px 0 20px;display:block}
    .q-verse{
      font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;
      color:var(--gold);text-align:center;padding:0 8px;margin-bottom:14px;line-height:1.6;
    }
    .q-text{
      font-size:22px;font-weight:700;line-height:30px;
      letter-spacing:-.4px;text-align:center;width:100%;color:var(--navy);margin-bottom:20px;
      font-family:'Cormorant Garamond',serif;
    }
    .stmt-banner{
      width:100%;background:var(--navy);border-radius:14px;padding:18px 20px;
      font-family:'Cormorant Garamond',serif;font-size:16px;font-style:italic;
      line-height:26px;color:rgba(255,255,255,.9);margin-bottom:18px;
      border-left:3px solid var(--gold);
    }
    .stmt-lbl{font-size:12px;font-weight:600;color:var(--muted);text-align:center;margin-bottom:10px;letter-spacing:.3px}

    /* ── ANSWERS ── */
    .answers{display:flex;flex-direction:column;gap:10px;width:100%}
    .ans{
      background:var(--surface);border:1.5px solid var(--border);
      border-radius:14px;color:var(--text);font-family:inherit;
      font-size:15px;font-weight:500;line-height:22px;
      padding:16px 18px 16px 46px;cursor:pointer;text-align:left;
      transition:border-color .18s,background .18s,transform .1s;width:100%;
      box-shadow:var(--shadow-sm);position:relative;
    }
    .ans::before{
      content:'';position:absolute;left:16px;top:50%;transform:translateY(-50%);
      width:18px;height:18px;border-radius:50%;
      border:1.5px solid var(--border);background:var(--bg);
      transition:border-color .18s,background .18s;
    }
    .ans:hover{background:var(--bg2);border-color:var(--navy)}
    .ans:hover::before{border-color:var(--navy)}
    .ans.sel{background:rgba(27,42,74,.06);border-color:var(--navy)}
    .ans.sel::before{background:var(--navy);border-color:var(--navy);box-shadow:inset 0 0 0 4px var(--bg2)}
    .ans:active{transform:scale(.99)}

    /* ── SUBMIT BUTTON ── */
    .submit-btn{
      background:var(--navy);color:#fff;border:none;border-radius:14px;
      font-family:inherit;font-size:16px;font-weight:700;padding:17px;
      cursor:pointer;width:100%;transition:opacity .15s,transform .1s;
      margin-top:12px;box-shadow:0 4px 18px rgba(27,42,74,.28);letter-spacing:.2px;
    }
    .submit-btn:hover{opacity:.92;transform:translateY(-1px)}
    .submit-btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
    .submit-btn:active{transform:scale(.99)}

    /* ── POPUP OVERLAY ── */
    .overlay{
      position:fixed;inset:0;background:rgba(12,20,38,.72);
      z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;
      animation:overlayIn .2s ease both;
    }
    @keyframes overlayIn{from{opacity:0}to{opacity:1}}
    .popup{
      background:var(--surface);border-radius:22px;padding:30px 24px;
      width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px;
      animation:popIn .32s cubic-bezier(.34,1.3,.64,1) both;
      border-top:3.5px solid var(--gold);
    }
    @keyframes popIn{from{transform:scale(.82) translateY(20px);opacity:0}to{transform:none;opacity:1}}
    .popup-img{width:100%;border-radius:12px;max-height:160px;object-fit:cover;margin-bottom:4px}
    .popup-tag{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1px}
    .popup-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;line-height:28px;color:var(--navy)}
    .popup-text{font-size:14px;color:var(--muted);line-height:22px}
    .popup-verse{
      font-family:'Cormorant Garamond',serif;font-size:15px;font-style:italic;
      color:var(--text);border-left:3px solid var(--gold);padding-left:14px;line-height:24px;
    }
    .popup-vref{font-size:11px;font-weight:700;color:var(--gold);margin-top:5px;text-transform:uppercase;letter-spacing:.5px}
    .popup-close{
      background:var(--navy);color:#fff;border:none;border-radius:14px;
      font-family:inherit;font-size:16px;font-weight:700;padding:16px;
      cursor:pointer;transition:opacity .15s;box-shadow:0 4px 14px rgba(27,42,74,.28);
    }
    .popup-close:hover{opacity:.9}

    /* ── NAME ── */
    .name-screen{display:flex;flex-direction:column;align-items:center;padding:32px 0 0;gap:0;text-align:center}
    .name-img{width:100%;border-radius:16px;box-shadow:var(--shadow);margin-bottom:24px;display:block}
    .name-title{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;line-height:36px;color:var(--navy);margin-bottom:8px}
    .name-sub{font-size:14px;color:var(--muted);line-height:21px;margin-bottom:24px;max-width:300px}
    .text-input{
      background:var(--surface);border:1.5px solid var(--border);
      border-radius:14px;color:var(--text);font-family:inherit;
      font-size:18px;font-weight:500;padding:18px 20px;width:100%;
      outline:none;transition:border-color .2s;box-shadow:var(--shadow-sm);margin-bottom:12px;
    }
    .text-input::placeholder{color:#B0C4D4}
    .text-input:focus{border-color:var(--navy)}
    .text-input.err{border-color:#C0392B}

    /* ── LOADING ── */
    .loading{
      display:flex;flex-direction:column;align-items:center;
      justify-content:center;min-height:100vh;gap:22px;padding:20px;text-align:center;
    }
    .l-painting{width:100%;max-width:280px;border-radius:14px;box-shadow:var(--shadow);margin-bottom:4px;animation:paintFade 1.2s ease}
    @keyframes paintFade{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
    .l-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:var(--navy);line-height:33px}
    .l-verse{font-family:'Cormorant Garamond',serif;font-size:14px;font-style:italic;color:var(--gold);max-width:280px;line-height:22px}
    .l-bar-wrap{width:100%;max-width:260px;height:3px;background:var(--border);border-radius:3px;overflow:hidden}
    .l-bar{height:3px;background:linear-gradient(90deg,var(--gold),#E8A84C);border-radius:3px;width:0%;animation:lp 4.5s cubic-bezier(.3,0,.7,1) forwards}
    @keyframes lp{from{width:0%}to{width:100%}}
    .l-steps{display:flex;flex-direction:column;gap:12px;width:100%;max-width:260px;text-align:left;margin-top:4px}
    .lstep{display:flex;align-items:center;gap:10px;font-size:13px;color:#B0C4D4;opacity:0;transition:opacity .4s,color .4s}
    .lstep.on{opacity:1;color:var(--navy)}
    .lstep-icon{width:20px;height:20px;border-radius:50%;background:var(--border);flex-shrink:0;transition:background .3s;display:flex;align-items:center;justify-content:center;font-size:10px}
    .lstep.on .lstep-icon{background:var(--gold);color:#fff}

    /* ── EMAIL ── */
    .email-screen{display:flex;flex-direction:column;align-items:center;padding:32px 0 0;gap:0;text-align:center}
    .email-img{width:100%;border-radius:16px;object-fit:cover;max-height:200px;box-shadow:var(--shadow);margin-bottom:22px}
    .reveal-badge{
      background:var(--gold-pale);border:1px solid var(--gold-soft);
      border-radius:20px;padding:5px 14px;font-size:12px;font-weight:700;
      color:var(--gold);letter-spacing:.4px;margin-bottom:14px;
    }
    .email-title{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;line-height:36px;color:var(--navy);margin-bottom:8px}
    .email-sub{font-size:14px;color:var(--muted);line-height:21px;margin-bottom:18px;max-width:310px}
    .email-verse{font-family:'Cormorant Garamond',serif;font-size:13px;font-style:italic;color:var(--gold);margin-bottom:20px;padding:0 8px}

    /* ── RESULTS ── */
    .results{display:flex;flex-direction:column;align-items:center;padding:28px 0 80px;gap:22px;width:100%}

    /* Gift reveal — dramatic */
    .reveal-screen{
      position:fixed;inset:0;z-index:300;background:var(--navy);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:24px;text-align:center;
    }
    .reveal-painting{
      width:100%;max-width:340px;border-radius:16px;box-shadow:0 4px 40px rgba(0,0,0,.6);
      margin-bottom:28px;opacity:0;animation:revealPaint 1.2s 0.3s ease forwards;
    }
    @keyframes revealPaint{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
    .reveal-eyebrow{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;opacity:0;animation:fadeUp .5s 1.3s ease forwards}
    .reveal-gift{
      font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:700;color:#fff;
      line-height:48px;margin-bottom:10px;opacity:0;animation:fadeUp .6s 1.5s ease forwards;
    }
    .reveal-verse{font-family:'Cormorant Garamond',serif;font-size:14px;font-style:italic;color:var(--gold-soft);margin-bottom:28px;opacity:0;animation:fadeUp .5s 1.8s ease forwards;max-width:320px}
    .reveal-btn{
      background:var(--gold);color:var(--navy);border:none;border-radius:14px;
      font-family:inherit;font-size:17px;font-weight:800;padding:18px 32px;
      cursor:pointer;opacity:0;animation:fadeUp .5s 2.1s ease forwards;
      box-shadow:0 4px 20px rgba(196,145,58,.4);
    }
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

    .r-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;line-height:34px;letter-spacing:-.3px;text-align:center;color:var(--navy)}
    .gift-card{background:var(--surface);border-radius:20px;padding:26px;width:100%;border:1.5px solid var(--border);box-shadow:var(--shadow)}
    .gift-card-img{width:100%;border-radius:12px;max-height:180px;object-fit:cover;margin-bottom:16px}
    .gift-label{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
    .gift-name{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;margin-bottom:8px;color:var(--navy)}
    .gift-verse{font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--gold);margin-bottom:12px;font-style:italic}
    .gift-desc{font-size:14px;color:var(--muted);line-height:23px}
    .divider{width:100%;height:1px;background:var(--border)}
    .score-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;align-self:flex-start}
    .score-row{display:flex;flex-direction:column;gap:14px;width:100%}
    .score-item{display:flex;flex-direction:column;gap:6px}
    .score-lr{display:flex;justify-content:space-between}
    .score-lbl{font-size:13px;font-weight:600;color:var(--muted)}
    .score-val{font-size:13px;font-weight:700;color:var(--navy)}
    .score-track{width:100%;height:5px;background:var(--border);border-radius:5px;overflow:hidden}
    .score-fill{height:5px;background:linear-gradient(90deg,var(--gold),#E8A84C);border-radius:5px;transition:width 1.1s cubic-bezier(.22,.61,.36,1)}

    /* CTA section */
    .cta-section{width:100%;display:flex;flex-direction:column;gap:14px;align-items:center}
    .cta-top{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;text-align:center;color:var(--navy);line-height:30px}
    .cta-sub{font-size:14px;color:var(--muted);text-align:center;line-height:21px;max-width:320px}
    .cta-btn{
      display:block;width:100%;background:var(--navy);color:#fff;border:none;
      border-radius:16px;font-family:inherit;font-size:17px;font-weight:700;
      padding:20px 24px;text-align:center;text-decoration:none;cursor:pointer;
      transition:opacity .15s,transform .1s;
      box-shadow:0 6px 22px rgba(27,42,74,.32);letter-spacing:.2px;
    }
    .cta-btn:hover{opacity:.92;transform:translateY(-1px)}
    .cta-note{font-size:12px;color:var(--muted);text-align:center}

    /* Ministry stripe */
    .ministry-stripe{
      width:100%;background:var(--navy);border-radius:18px;
      padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;
    }
    .ms-cross{font-size:22px;color:var(--gold-soft)}
    .ms-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:#fff;text-align:center;line-height:27px}
    .ms-text{font-size:13px;color:rgba(255,255,255,.7);text-align:center;line-height:20px;max-width:300px}
  </style>

<body>
<div id="app"></div>
<audio id="bg-music" src="assets/background_audio.mp3" loop preload="none"></audio>

<script>
// ═══════════════════════════════════════════════════════════════════════
// GIFTED MINISTRY — Spiritual Gifts Assessment
// 33 Questions — One for each year of Christ's life
// ═══════════════════════════════════════════════════════════════════════

// ── WEB AUDIO SOUNDS ────────────────────────────────────────────────
let _AC = null;
function getAC(){
  if(!_AC){try{_AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  return _AC;
}
function playSelect(){
  const ac=getAC();if(!ac)return;
  const osc=ac.createOscillator(),g=ac.createGain();
  osc.connect(g);g.connect(ac.destination);
  osc.type='sine';osc.frequency.setValueAtTime(698,ac.currentTime); // F5 — soft bell
  g.gain.setValueAtTime(0,ac.currentTime);
  g.gain.linearRampToValueAtTime(0.13,ac.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.28);
  osc.start(ac.currentTime);osc.stop(ac.currentTime+0.3);
}
function playSubmit(){
  const ac=getAC();if(!ac)return;
  // C major chord — satisfied, resolved
  [261.63,329.63,392].forEach((f,i)=>{
    const osc=ac.createOscillator(),g=ac.createGain();
    osc.connect(g);g.connect(ac.destination);
    osc.type='triangle';osc.frequency.setValueAtTime(f,ac.currentTime);
    g.gain.setValueAtTime(0,ac.currentTime);
    g.gain.linearRampToValueAtTime(0.07,ac.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.75);
    osc.start(ac.currentTime);osc.stop(ac.currentTime+0.8);
  });
}
function playMilestone(){
  const ac=getAC();if(!ac)return;
  // Ascending C pentatonic arpeggio

      {t:'It would be the most important thing — because God\'s gifts are not given to be unused',g:'T',s:3},
    ]},

  {type:'loading'},
  {type:'nameemail'},
];

// ── SCORING ──────────────────────────────────────────────────────────
function primaryGift(){
  const s=S.scores;
  const best=Object.entries(s).reduce((a,b)=>b[1]>a[1]?b:a,['F',0]);
  const map={F:'Faith & Prayer',M:'Mercy & Service',P:'Prophecy & Discernment',T:'Teaching & Leadership'};
  return map[best[0]]||'Faith & Prayer';
}
function giftScores(){
  const s=S.scores;
  const total=Math.max(1,Object.values(s).reduce((a,b)=>a+b,0));
  return [
    {lbl:'Faith & Prayer',        pct:Math.round(s.F/total*100)},
    {lbl:'Mercy & Service',       pct:Math.round(s.M/total*100)},
    {lbl:'Prophecy & Discernment',pct:Math.round(s.P/total*100)},
    {lbl:'Teaching & Leadership', pct:Math.round(s.T/total*100)},
  ].sort((a,b)=>b.pct-a.pct);
}

// ── NAVIGATION ───────────────────────────────────────────────────────
function item(){return FLOW[S.idx]}
function isQ(f){return f&&f.type==='q'}
function totalQs(){return FLOW.filter(f=>isQ(f)).length}
function currentQNum(){
  // count how many q-type items we've passed
  return FLOW.slice(0,S.idx+1).filter(f=>isQ(f)).length;
}
function phaseProg(){
  const it=item();
  if(!it||!isQ(it))return{phase:PHASES[0],pct:0};
  const ph=it.phase||0;
  const inPhase=FLOW.filter(f=>isQ(f)&&f.phase===ph);
  const done=FLOW.slice(0,S.idx).filter(f=>isQ(f)&&f.phase===ph).length;
  return{phase:PHASES[ph],pct:Math.round((done/inPhase.length)*100)};
}

function advance(){
  if(S._transitioning)return;
  S._transitioning=true;
  const app=document.getElementById('app');
  const screen=app&&app.querySelector('.screen');
  if(screen){
    screen.classList.add('screen-out');
    setTimeout(()=>{S.idx++;S.pending=null;S._transitioning=false;render()},190);
  } else {
    S.idx++;S.pending=null;S._transitioning=false;render();
  }
}
function goBack(){
  if(S.idx<=0)return;
  if(S._transitioning)return;
  S._transitioning=true;
  const app=document.getElementById('app');
  const screen=app&&app.querySelector('.screen');
  // slide back — temporarily reverse animation direction
  if(screen){
    screen.style.animation='slideOut .18s ease-in both';
    setTimeout(()=>{
      // find prev non-popup
      let prev=S.idx-1;
      while(prev>0&&FLOW[prev]&&FLOW[prev].type==='popup')prev--;
      S.idx=prev;S.pending=null;S._transitioning=false;render();
    },190);
  } else {
    S.idx=Math.max(0,S.idx-1);S.pending=null;S._transitioning=false;render();
  }
}

// ── VALIDATION ───────────────────────────────────────────────────────
function _lockAdvance(){
  if(S._advanceLocked)return true;
  S._advanceLocked=true;
  setTimeout(()=>{S._advanceLocked=false},900);
  return false;
}

// ── RENDER ───────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  const it=item();
  if(!it)return;
  if(S.popup){renderPopup(app);return}
  switch(it.type){
    case 'intro':     app.innerHTML=rIntro(); break;
    case 'q':         app.innerHTML=rQ(it); break;
    case 'loading':   app.innerHTML=rLoading(); startLoadingAnim(); break;
    case 'nameemail': app.innerHTML=rNameEmail(); break;
    case 'popup':     S.popup=it.popup; renderPopup(app); break;
    default: advance();
  }
}

function bk(){return`<button class="back" onclick="goBack()">← Back</button>`}

function prog(it){
  if(!isQ(it))return'';
  const pp=phaseProg();
  const qn=it.qnum||currentQNum();
  return`<div class="prog-wrap">
    <div class="prog-meta"><strong>Question ${qn} of 33</strong> · ${pp.phase.name}</div>
    <div class="prog-track"><div class="prog-fill" style="width:${Math.round(qn/33*100)}%"></div></div>
  </div>`;
}

// ── QUESTION SCREEN ───────────────────────────────────────────────────
function rQ(it){
  const isStmt=it.stmt===true;
  return`<div class="screen">
  ${hdr()}${prog(it)}${bk()}
  <div class="q-wrap">
    ${it.phase===0&&it.qnum===1?`<div class="phase-lbl">✦ The Hidden Years · Phase 1 of 4</div>`:''}
    ${it.phase===1&&it.qnum===9?`<div class="phase-lbl">✦ The Wilderness · Phase 2 of 4</div>`:''}
    ${it.phase===2&&it.qnum===17?`<div class="phase-lbl">✦ The Ministry Years · Phase 3 of 4</div>`:''}
    ${it.phase===3&&it.qnum===25?`<div class="phase-lbl">✦ The Calling · Phase 4 of 4</div>`:''}
    ${it.img?`<img class="q-img" src="${it.img}" alt="Carl Bloch">`:''}
    ${it.verse?`<div class="q-verse">${it.verse}</div>`:''}
    ${isStmt
      ?`<div class="stmt-lbl">Can you relate to this statement?</div>

      :`<div class="q-text">${it.text}</div>`}

}

// ── REVEAL (dramatic) + RESULTS ───────────────────────────────────────

// ── INTERACTIONS ──────────────────────────────────────────────────────
function pickGender(g){
  playSelect();S.gender=g;_track('step_gender',{gender:g});render();
  setTimeout(()=>{startMusic();S.idx++;render();},280);
}

function selectAns(i){
  playSelect();
  S.pending=i;
  // Update UI without full re-render
  document.querySelectorAll('.ans').forEach((el,idx)=>{
    el.classList.toggle('sel',idx===i);
  });
  const btn=document.getElementById('submit-btn');
  if(btn)btn.disabled=false;
}

function submitAns(){
  if(S.pending===null)return;
  if(_lockAdvance())return;
  const it=item();
  const ans=it.answers[S.pending];
  if(ans&&ans.g){
    S.scores[ans.g]=(S.scores[ans.g]||0)+(ans.s||0);
  }
  playSubmit();
  if(it.qnum)_track('step_q'+it.qnum,{phase:it.phase||0});
  const nextIdx=S.idx+1;
  if(FLOW[nextIdx]&&FLOW[nextIdx].type==='popup'){
    setTimeout(()=>advance(),120);
  } else {
    advance();
  }
}

function closePopup(){
  playSubmit();S.popup=null;advance();
}

function submitNameEmail(){
  const ni=document.getElementById('name-input');
  const ei=document.getElementById('email-inp');
  const name=(ni?ni.value.trim():S.name)||'';
  const email=(ei?ei.value.trim():S.email)||'';

  if(name.length<2){
    if(ni){ni.style.borderColor='#C0392B';ni.focus();}
    return;
  }
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){
    if(ei){ei.style.borderColor='#C0392B';ei.focus();}
    return;
  }

  S.name=name; S.email=email;
  playSubmit();
  _track('step_email',{gift:primaryGift()});
  if(window._gtag)_gtag('event','generate_lead',{event_category:'funnel'});
  if(window._fbq)_fbq('track','Lead',{value:0.01,currency:'USD'});

  // Send to Mailchimp (fire and forget)
  const gift=primaryGift();
  fetch('/api/quiz-submit',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name,email,gender:S.gender,gift,scores:S.scores})
  }).catch(()=>{});

  // Store gift for offering page to reference
  try{sessionStorage.setItem('gifted_gift',gift);sessionStorage.setItem('gifted_name',name);}catch(e){}

  // Redirect to offering page — the guide is where the gift is revealed
  setTimeout(()=>{window.location.href='offering.html';},350);
}

// ── LOADING ANIMATION ─────────────────────────────────────────────────
function startLoadingAnim(){
  [500,1400,2600,3800].forEach((t,i)=>{
    setTimeout(()=>{const el=document.getElementById('ls'+i);if(el)el.classList.add('on');},t);
  });
  setTimeout(()=>advance(),5000);
}

// ── FADE OUT KEYFRAME ─────────────────────────────────────────────────
const _style=document.createElement('style');
_style.textContent='@keyframes fadeOut{from{opacity:1}to{opacity:0}}';
document.head.appendChild(_style);

// ── TRACKING ─────────────────────────────────────────────────────────
function _track(event, extra){
  const body={event,...(extra||{})};
  fetch('/api/track',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body),
  }).catch(()=>{});
  if(window._gtag)_gtag('event',event,{event_category:'gifted_funnel',...(extra||{})});
  if(window._fbq&&['step_email','step_results','paywall_viewed'].includes(event)){
    const fbMap={step_email:'Lead',step_results:'ViewContent',paywall_viewed:'InitiateCheckout'};
    if(fbMap[event])_fbq('track',fbMap[event]);
  }
}

// ── INIT ──────────────────────────────────────────────────────────────
_track('quiz_started');
render();
